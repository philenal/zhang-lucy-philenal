# Render blueprint for the free web service.
# Create the service from this file, then fill in MONGO_SRV (and GOOGLE_CLIENT_ID
# only if you are not using the client id baked into shared/googleClientId.js).
# SESSION_SECRET is generated by Render. Do not commit real values.
services:
  - type: web
    name: pixonary
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server/server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_SRV
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
